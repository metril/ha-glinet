name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.8.0); creates tag v<version> and the GitHub release"
        required: true
        type: string
      notes:
        description: "Release notes (Markdown). Leave empty to auto-generate."
        required: false
        type: string
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Passed via env so Markdown (backticks, quotes) is never shell-interpreted.
      RELEASE_NOTES_INPUT: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          case "${{ github.event_name }}" in
            release) TAG="${{ github.event.release.tag_name }}" ;;
            push) TAG="${{ github.ref_name }}" ;;
            *) TAG="${{ inputs.version }}" ;;
          esac
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update manifest version
        run: |
          jq --arg v "${{ steps.v.outputs.version }}" '.version = $v' custom_components/glinet/manifest.json > tmp.json
          mv tmp.json custom_components/glinet/manifest.json

      - name: Create release ZIP
        run: |
          cd custom_components/glinet
          zip -r ../../glinet.zip .

      # On `release: published` the release already exists, so only upload.
      - name: Create release (tag push / manual dispatch)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping creation."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ -f RELEASE_NOTES.md ]; then
              gh release create "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
            else
              gh release create "$TAG" --title "$TAG" --generate-notes
            fi
          elif [ -n "$RELEASE_NOTES_INPUT" ]; then
            printf '%s\n' "$RELEASE_NOTES_INPUT" > notes.md
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi

      - name: Upload release asset
        run: gh release upload "${{ steps.v.outputs.tag }}" glinet.zip --clobber
